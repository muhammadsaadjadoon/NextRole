name: nextrole
description: A Flutter hiring workspace for candidates, employers and administrators.
publish_to: none
version: 2.1.0+3
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  uuid: ^4.5.1
  http: ^1.2.0
  html: ^0.15.4
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
