name: NextRole checks
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --empty --platforms=android,ios,web --project-name=nextrole --org=com.saadi .
      - run: flutter pub get
      - run: dart run scripts/configure_platforms.dart
      - run: dart format lib test scripts
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=DEMO=true
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: tests/security
      - run: firebase emulators:exec --only firestore --project demo-nextrole 'cd tests/security && npm test'
